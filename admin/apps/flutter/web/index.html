<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="开放管理后台 - 全栈管理系统 (PC Web)">

  <!-- Favicon：SVG 吉祥物优先，回退 PNG -->
  <link rel="icon" type="image/svg+xml" href="mascot.svg"/>
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>开放管理后台</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Flutter 引擎加载期间的品牌启动屏（首帧渲染后由脚本移除） */
    #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#f5f7fa;z-index:9999;transition:opacity .3s}
    #splash img{width:140px;height:140px}
    #splash .txt{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14px;color:#666}
    #splash .bar{width:180px;height:3px;border-radius:2px;background:#e0e0e0;overflow:hidden}
    #splash .bar i{display:block;width:40%;height:100%;border-radius:2px;background:#4f46e5;animation:load 1.1s ease-in-out infinite}
    @keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
  </style>
</head>
<body>
  <div id="splash">
    <img src="mascot.svg" alt="日历精灵「小约」（吉祥物）">
    <div class="txt">开放管理后台 · 正在加载…</div>
    <div class="bar"><i></i></div>
  </div>
  <script>
    // 首帧后移除启动屏；兜底 15s 强制移除，避免事件未触发时遮挡界面
    (function () {
      function hide() {
        var s = document.getElementById('splash');
        if (!s) return;
        s.style.opacity = '0';
        setTimeout(function () { s.remove(); }, 300);
      }
      window.addEventListener('flutter-first-frame', hide);
      setTimeout(hide, 15000);
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
