<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" role="img" aria-labelledby="title desc">
  <title id="title">Maskot Sistem Layanan Janji Temu — Yue, si Peri Kalender</title>
  <desc id="desc">Kalender janji temu itu sendiri yang dijadikan karakter: bagian atas merah + dua cincin + halaman tanggal putih, dengan wajah di halamannya, centang hijau di sudut kanan bawah menandakan janji temu berhasil, dan empat titik berwarna di bagian bawah mewakili empat platform: Mini Program/APP/HarmonyOS/Admin. Animasi SMIL murni, tanpa dependensi eksternal</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#232650"/>
      <stop offset="100%" stop-color="#312B6E"/>
    </linearGradient>
    <linearGradient id="pageGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EEF1FB"/>
    </linearGradient>
    <linearGradient id="headGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF7586"/>
      <stop offset="100%" stop-color="#F04159"/>
    </linearGradient>
    <linearGradient id="armGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD8E0"/>
      <stop offset="100%" stop-color="#FFB9CB"/>
    </linearGradient>
  </defs>

  <!-- 徽章：外圈浅描边替代投影，不依赖滤镜，浅色背景上依然成立 -->
  <rect x="40" y="40" width="400" height="400" rx="96" fill="#1B1E42" opacity="0.5"/>
  <rect x="44" y="44" width="392" height="392" rx="92" fill="url(#bgGrad)"/>
  <rect x="54" y="54" width="372" height="372" rx="82" fill="none" stroke="#7C88FF" stroke-width="2.5" opacity="0.4"/>
  <ellipse cx="130" cy="98" rx="168" ry="78" fill="#FFFFFF" opacity="0.07" transform="rotate(-18 130 98)"/>

  <!-- 悬浮底座 -->
  <ellipse cx="240" cy="404" rx="120" ry="16" fill="none" stroke="#4FE3C1" stroke-width="2.5" opacity="0.4">
    <animate attributeName="opacity" values="0.2;0.55;0.2" keyTimes="0;0.5;1" dur="3.4s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="240" cy="404" rx="60" ry="9" fill="#4FE3C1" opacity="0.14">
    <animate attributeName="opacity" values="0.08;0.28;0.08" keyTimes="0;0.5;1" dur="3.4s" repeatCount="indefinite"/>
  </ellipse>

  <!-- 四端指示：四色圆点依次点亮 -->
  <g>
    <circle cx="168" cy="404" r="7.5" fill="#4FE3C1"><animate attributeName="opacity" values="0.4;1;0.4" keyTimes="0;0.5;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="216" cy="404" r="7.5" fill="#A78BFF"><animate attributeName="opacity" values="0.4;1;0.4" keyTimes="0;0.5;1" dur="2.6s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="264" cy="404" r="7.5" fill="#FF8A6B"><animate attributeName="opacity" values="0.4;1;0.4" keyTimes="0;0.5;1" dur="2.6s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="312" cy="404" r="7.5" fill="#FF7AA2"><animate attributeName="opacity" values="0.4;1;0.4" keyTimes="0;0.5;1" dur="2.6s" begin="1.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 日历精灵本体：整体悬浮 -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" keyTimes="0;0.5;1" dur="4.6s" repeatCount="indefinite"/>

    <!-- 双线圈 -->
    <rect x="176" y="126" width="11" height="46" rx="5.5" fill="#C9CFE8"/>
    <rect x="293" y="126" width="11" height="46" rx="5.5" fill="#C9CFE8"/>

    <!-- 手臂：自身体两侧垂下，左臂轻摆 -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-7 138 262;4 138 262;-7 138 262" keyTimes="0;0.5;1" dur="4s" repeatCount="indefinite"/>
      <rect x="98" y="250" width="46" height="24" rx="12" fill="url(#armGrad)" transform="rotate(-16 140 262)"/>
    </g>
    <rect x="336" y="250" width="46" height="24" rx="12" fill="url(#armGrad)" transform="rotate(16 340 262)"/>

    <!-- 卡体：红色卡头 -->
    <rect x="132" y="152" width="216" height="200" rx="42" fill="url(#headGrad)"/>
    <!-- 白色日期页 -->
    <path d="M132 200 L348 200 L348 310 A42 42 0 0 1 306 352 L174 352 A42 42 0 0 1 132 310 Z" fill="url(#pageGrad)"/>
    <!-- 卡头高光与分界 -->
    <path d="M132 194 A42 42 0 0 1 174 152 L306 152 A42 42 0 0 1 348 194 Z" fill="#FFFFFF" opacity="0.18"/>
    <path d="M132 198 H348" stroke="#000000" stroke-width="4" opacity="0.06"/>

    <!-- 表情：错峰眨眼 -->
    <g transform="translate(202 250)">
      <g>
        <animateTransform attributeName="transform" type="scale" values="1 1;1 0.08;1 1" keyTimes="0;0.045;0.11" dur="3.8s" begin="0.9s" repeatCount="indefinite"/>
        <ellipse rx="11.5" ry="16" fill="#2B2348"/>
        <circle cx="-3.8" cy="-6.5" r="4.6" fill="#FFFFFF"/>
        <circle cx="2.8" cy="4.6" r="2.1" fill="#8FF0DC" opacity="0.9"/>
      </g>
    </g>
    <g transform="translate(278 250)">
      <g>
        <animateTransform attributeName="transform" type="scale" values="1 1;1 0.08;1 1" keyTimes="0;0.045;0.11" dur="3.8s" begin="2.2s" repeatCount="indefinite"/>
        <ellipse rx="11.5" ry="16" fill="#2B2348"/>
        <circle cx="-3.8" cy="-6.5" r="4.6" fill="#FFFFFF"/>
        <circle cx="2.8" cy="4.6" r="2.1" fill="#8FF0DC" opacity="0.9"/>
      </g>
    </g>
    <ellipse cx="178" cy="274" rx="13" ry="7.5" fill="#FFB3C6" opacity="0.8"/>
    <ellipse cx="302" cy="274" rx="13" ry="7.5" fill="#FFB3C6" opacity="0.8"/>
    <path d="M229 276 Q240 287 251 276" stroke="#2B2348" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.75"/>

    <!-- 日期格：三个待选时段 -->
    <rect x="164" y="304" width="30" height="6" rx="3" fill="#2B2348" opacity="0.13"/>
    <rect x="202" y="304" width="30" height="6" rx="3" fill="#2B2348" opacity="0.13"/>
    <rect x="240" y="304" width="30" height="6" rx="3" fill="#2B2348" opacity="0.13"/>

    <!-- 对勾：预约成功，回弹 -->
    <g transform="translate(310 330)">
      <g>
        <animateTransform attributeName="transform" type="scale" values="1 1;0.72 0.72;1.14 1.14;1 1" keyTimes="0;0.4;0.62;1" dur="2.2s" begin="0.9s" repeatCount="indefinite"/>
        <circle r="27" fill="#34C77B"/>
        <circle r="27" fill="none" stroke="#1F9E5C" stroke-width="2" opacity="0.35"/>
        <path d="M-12.5 0 l8.5 9.5 l17 -18" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
    </g>

    <!-- 小脚 -->
    <rect x="188" y="346" width="34" height="22" rx="11" fill="#DCE2F5"/>
    <rect x="258" y="346" width="34" height="22" rx="11" fill="#DCE2F5"/>
  </g>

  <!-- 星光 -->
  <g transform="translate(70 84)"><path d="M0 -11 L2.6 -2.6 L11 0 L2.6 2.6 L0 11 L-2.6 2.6 L-11 0 L-2.6 -2.6 Z" fill="#FFD98A"><animate attributeName="opacity" values="0.12;0.8;0.12" keyTimes="0;0.5;1" dur="2.4s" begin="0.3s" repeatCount="indefinite"/></path></g>
  <g transform="translate(414 130) scale(0.8)"><path d="M0 -11 L2.6 -2.6 L11 0 L2.6 2.6 L0 11 L-2.6 2.6 L-11 0 L-2.6 -2.6 Z" fill="#4FE3C1"><animate attributeName="opacity" values="0.12;0.8;0.12" keyTimes="0;0.5;1" dur="2.8s" begin="1.4s" repeatCount="indefinite"/></path></g>
  <g transform="translate(76 320) scale(0.85)"><path d="M0 -11 L2.6 -2.6 L11 0 L2.6 2.6 L0 11 L-2.6 2.6 L-11 0 L-2.6 -2.6 Z" fill="#FFD98A"><animate attributeName="opacity" values="0.12;0.8;0.12" keyTimes="0;0.5;1" dur="3.1s" begin="2s" repeatCount="indefinite"/></path></g>
</svg>
