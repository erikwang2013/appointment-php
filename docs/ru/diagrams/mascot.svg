<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" role="img" aria-labelledby="title desc">
  <title id="title">Талисман системы записи — зайчик записи</title>
  <desc id="desc">На животе — календарь записи (27 + зелёная галочка = запись успешна), на голографической подставке четыре иконки — мини-программа/APP/HarmonyOS/админка, зависает в воздухе, моргает и машет</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#232650"/>
      <stop offset="100%" stop-color="#312B6E"/>
    </linearGradient>
    <radialGradient id="headGrad" cx="32%" cy="26%" r="85%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F6EADB"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFDF8"/>
      <stop offset="100%" stop-color="#F3E6D6"/>
    </linearGradient>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0D0F2B" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- 徽章：深空渐变 + 霓虹内发光 -->
  <rect x="40" y="40" width="400" height="400" rx="92" fill="url(#bgGrad)" filter="url(#badgeShadow)"/>
  <rect x="49" y="49" width="382" height="382" rx="84" fill="none" stroke="#6E7BFF" stroke-width="2.5" opacity="0.35"/>
  <ellipse cx="125" cy="95" rx="170" ry="80" fill="#FFFFFF" opacity="0.08" transform="rotate(-18 125 95)"/>

  <!-- 背景点阵 -->
  <circle cx="385" cy="85" r="2" fill="#FFFFFF" opacity="0.14"/>
  <circle cx="410" cy="260" r="2.6" fill="#FFFFFF" opacity="0.12"/>
  <circle cx="78" cy="250" r="2" fill="#FFFFFF" opacity="0.14"/>
  <circle cx="110" cy="360" r="2.2" fill="#FFFFFF" opacity="0.1"/>
  <circle cx="395" cy="395" r="2" fill="#FFFFFF" opacity="0.1"/>

  <!-- 全息底座：光环 + 四端图标 -->
  <ellipse cx="245" cy="424" rx="150" ry="18" fill="none" stroke="#4FE3C1" stroke-width="2" opacity="0.15">
    <animate attributeName="opacity" values="0.1;0.22;0.1" keyTimes="0;0.5;1" dur="3.6s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="245" cy="424" rx="118" ry="14" fill="none" stroke="#4FE3C1" stroke-width="2.5" opacity="0.45"/>
  <ellipse cx="245" cy="424" rx="52" ry="8" fill="#4FE3C1" opacity="0.15">
    <animate attributeName="opacity" values="0.1;0.28;0.1" keyTimes="0;0.5;1" dur="3.6s" repeatCount="indefinite"/>
  </ellipse>
  <!-- 小程序：气泡 + 双眼 -->
  <g opacity="0.8">
    <animate attributeName="opacity" values="0.45;1;0.45" keyTimes="0;0.5;1" dur="2.4s" repeatCount="indefinite"/>
    <rect x="121.5" y="405.5" width="27" height="19" rx="8" fill="none" stroke="#4FE3C1" stroke-width="2.2"/>
    <path d="M127 421 l-6 7 l7 -2" fill="none" stroke="#4FE3C1" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="130" cy="412.5" r="1.8" fill="#4FE3C1"/>
    <circle cx="139" cy="412.5" r="1.8" fill="#4FE3C1"/>
  </g>
  <!-- APP：手机 -->
  <g opacity="0.8">
    <animate attributeName="opacity" values="0.45;1;0.45" keyTimes="0;0.5;1" dur="2.4s" begin="0.5s" repeatCount="indefinite"/>
    <rect x="200.5" y="402" width="15" height="26" rx="4" fill="none" stroke="#A78BFF" stroke-width="2.2"/>
    <rect x="205" y="407" width="6" height="13" rx="1.5" fill="#A78BFF" opacity="0.6"/>
    <circle cx="208" cy="424" r="1.3" fill="#A78BFF"/>
  </g>
  <!-- 鸿蒙：四芒星 -->
  <g opacity="0.8">
    <animate attributeName="opacity" values="0.45;1;0.45" keyTimes="0;0.5;1" dur="2.4s" begin="1s" repeatCount="indefinite"/>
    <path d="M282 402 L285.3 410.6 L293.5 415 L285.3 419.4 L282 428 L278.7 419.4 L270.5 415 L278.7 410.6 Z" fill="none" stroke="#FF8A6B" stroke-width="2.2" stroke-linejoin="round"/>
  </g>
  <!-- 后台：显示器 -->
  <g opacity="0.8">
    <animate attributeName="opacity" values="0.45;1;0.45" keyTimes="0;0.5;1" dur="2.4s" begin="1.5s" repeatCount="indefinite"/>
    <rect x="340.5" y="404.5" width="29" height="18.5" rx="3" fill="none" stroke="#FF7AA2" stroke-width="2.2"/>
    <path d="M355 423 L355 428 M349.5 429 L360.5 429" fill="none" stroke="#FF7AA2" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- 兔子整体：全息悬浮 -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" keyTimes="0;0.5;1" dur="4.6s" repeatCount="indefinite"/>

    <!-- 左耳 -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-6 185 152;4 185 152;-6 185 152" keyTimes="0;0.5;1" dur="3.8s" repeatCount="indefinite"/>
      <ellipse cx="172" cy="108" rx="28" ry="60" fill="#FFF8EC" transform="rotate(-8 172 108)"/>
      <ellipse cx="172" cy="112" rx="15" ry="42" fill="#FFC9DC" transform="rotate(-8 172 112)"/>
    </g>
    <!-- 右耳 -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="4 295 152;-6 295 152;4 295 152" keyTimes="0;0.5;1" dur="4.2s" begin="0.4s" repeatCount="indefinite"/>
      <ellipse cx="308" cy="108" rx="28" ry="60" fill="#FFF8EC" transform="rotate(8 308 108)"/>
      <ellipse cx="308" cy="112" rx="15" ry="42" fill="#FFC9DC" transform="rotate(8 308 112)"/>
    </g>

    <!-- 头部 -->
    <ellipse cx="245" cy="205" rx="100" ry="92" fill="url(#headGrad)"/>
    <ellipse cx="178" cy="140" rx="48" ry="20" fill="#FFFFFF" opacity="0.28" transform="rotate(-16 178 140)"/>
    <!-- 眼睛：眨眼 -->
    <g transform="translate(212 232)">
      <g>
        <animateTransform attributeName="transform" type="scale" values="1 1;1 0.07;1 1" keyTimes="0;0.045;0.11" dur="3.6s" begin="0.9s" repeatCount="indefinite"/>
        <ellipse rx="12.5" ry="16.5" fill="#2B2348"/>
        <circle cx="-4.5" cy="-7" r="5" fill="#FFFFFF"/>
        <circle cx="3" cy="5" r="2.2" fill="#8FF0DC" opacity="0.9"/>
      </g>
    </g>
    <g transform="translate(278 232)">
      <g>
        <animateTransform attributeName="transform" type="scale" values="1 1;1 0.07;1 1" keyTimes="0;0.045;0.11" dur="3.6s" begin="2.1s" repeatCount="indefinite"/>
        <ellipse rx="12.5" ry="16.5" fill="#2B2348"/>
        <circle cx="-4.5" cy="-7" r="5" fill="#FFFFFF"/>
        <circle cx="3" cy="5" r="2.2" fill="#8FF0DC" opacity="0.9"/>
      </g>
    </g>
    <!-- 腮红 + 鼻子 + 微笑 -->
    <ellipse cx="186" cy="254" rx="13" ry="7.5" fill="#FFC1D4" opacity="0.85"/>
    <ellipse cx="304" cy="254" rx="13" ry="7.5" fill="#FFC1D4" opacity="0.85"/>
    <path d="M241 246 L249 246 L245 253 Z" fill="#FF8FA8"/>
    <path d="M233 262 Q245 273 257 262" stroke="#B0788A" stroke-width="4.5" stroke-linecap="round" fill="none"/>

    <!-- 身体 -->
    <ellipse cx="245" cy="332" rx="78" ry="66" fill="url(#bodyGrad)"/>

    <!-- 手臂：左爪轻摆 -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-6 183 332;7 183 332;-6 183 332" keyTimes="0;0.5;1" dur="4.2s" repeatCount="indefinite"/>
      <path d="M174 324 Q179 312 189 316" stroke="#F3E6D6" stroke-width="22" stroke-linecap="round" fill="none"/>
      <circle cx="183" cy="332" r="15" fill="#FFFDF8"/>
    </g>
    <path d="M316 324 Q311 312 301 316" stroke="#F3E6D6" stroke-width="22" stroke-linecap="round" fill="none"/>
    <circle cx="307" cy="332" r="15" fill="#FFFDF8"/>

    <!-- 腹部预约日历卡：红头 + 日期 27 + 绿色对勾 -->
    <rect x="193" y="290" width="104" height="24" rx="12" fill="#FF5A6E"/>
    <rect x="193" y="312" width="104" height="64" rx="12" fill="#FFFFFF"/>
    <circle cx="203" cy="294" r="4" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="287" cy="294" r="4" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <text x="202" y="356" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#3B2E5A">27</text>
    <g transform="translate(284 348)">
      <g>
        <animateTransform attributeName="transform" type="scale" values="1 1;0.7 0.7;1.15 1.15;1 1" keyTimes="0;0.4;0.62;1" dur="2.2s" begin="0.9s" repeatCount="indefinite"/>
        <circle r="21" fill="#34C77B"/>
        <path d="M-10 0 l7 8 l14 -15" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
    </g>
  </g>

  <!-- 星光 -->
  <g transform="translate(62 68)"><path d="M0 -11 L2.6 -2.6 L11 0 L2.6 2.6 L0 11 L-2.6 2.6 L-11 0 L-2.6 -2.6 Z" fill="#FFD98A"><animate attributeName="opacity" values="0.12;0.8;0.12" keyTimes="0;0.5;1" dur="2.4s" begin="0.3s" repeatCount="indefinite"/></path></g>
  <g transform="translate(418 98) scale(0.8)"><path d="M0 -11 L2.6 -2.6 L11 0 L2.6 2.6 L0 11 L-2.6 2.6 L-11 0 L-2.6 -2.6 Z" fill="#4FE3C1"><animate attributeName="opacity" values="0.12;0.8;0.12" keyTimes="0;0.5;1" dur="2.8s" begin="1.4s" repeatCount="indefinite"/></path></g>
  <g transform="translate(78 372) scale(0.85)"><path d="M0 -11 L2.6 -2.6 L11 0 L2.6 2.6 L0 11 L-2.6 2.6 L-11 0 L-2.6 -2.6 Z" fill="#FFD98A"><animate attributeName="opacity" values="0.12;0.8;0.12" keyTimes="0;0.5;1" dur="3.1s" begin="2s" repeatCount="indefinite"/></path></g>
</svg>
